version: 2
updates:
  # JavaScript/TypeScript dependencies — checked weekly to keep noise low
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Bundle minor + patch updates by ecosystem to avoid PR storms
      typescript-tooling:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "tsx"
        update-types:
          - "minor"
          - "patch"
      eslint-prettier:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "prettier"
        update-types:
          - "minor"
          - "patch"
      test-tooling:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "jsdom"
        update-types:
          - "minor"
          - "patch"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pin Node major via .nvmrc, not via @types/node
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflow files
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Rome"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"

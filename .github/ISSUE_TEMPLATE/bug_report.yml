name: Bug report
description: Something doesn't work the way it should
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The more concrete this is, the faster we
        can fix it. If you've found a security issue, **stop** and read
        `SECURITY.md` instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the bug. One paragraph is plenty.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered steps so we can hit the bug ourselves.
      placeholder: |
        1. Open the library
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where the bug shows up
      options:
        - Web app (apps/web)
        - Recipe schema (@latent/recipe-schema)
        - PTP transport (@latent/ptp-fuji or ptp-fuji-webusb)
        - AI agent (@latent/ai-agent)
        - Documentation
        - Not sure
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser + version
      placeholder: "Chrome 138, Edge 138, Arc 1.x..."

  - type: input
    id: camera
    attributes:
      label: Camera model + firmware (if applicable)
      placeholder: "X-S20, firmware 1.10"

  - type: textarea
    id: logs
    attributes:
      label: Console output / errors
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
        - label: This is not a security issue (those go to SECURITY.md)
          required: true

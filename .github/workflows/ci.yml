name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      # typecheck must run before lint. `tsc -b` builds package dist/ outputs
      # that the type-aware ESLint rules (recommendedTypeChecked) need to
      # resolve cross-workspace imports like `@latent/ptp-fuji`. Lint without
      # dist/ produces ~170 spurious "no-unsafe-*" errors.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run license-check
      - run: npm run lockstep-check
